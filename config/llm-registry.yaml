# MoltNet LLM Registry - Master Catalog
# All available models with pricing, capabilities, and metadata

providers:
  ollama:
    name: "Ollama (Local)"
    base_url: "http://localhost:11434"
    auth_env: null
    api_format: "ollama"

  anthropic:
    name: "Anthropic"
    base_url: "https://api.anthropic.com"
    auth_env: "ANTHROPIC_API_KEY"
    api_format: "anthropic"

  openai:
    name: "OpenAI"
    base_url: "https://api.openai.com/v1"
    auth_env: "OPENAI_API_KEY"
    api_format: "openai_compatible"

  deepseek:
    name: "DeepSeek"
    base_url: "https://api.deepseek.com/v1"
    auth_env: "DEEPSEEK_API_KEY"
    api_format: "openai_compatible"

  mistral:
    name: "Mistral AI"
    base_url: "https://api.mistral.ai/v1"
    auth_env: "MISTRAL_API_KEY"
    api_format: "openai_compatible"

  zhipu:
    name: "Zhipu AI (GLM)"
    base_url: "https://open.bigmodel.cn/api/paas/v4"
    auth_env: "ZHIPU_API_KEY"
    api_format: "openai_compatible"

  claude_code:
    name: "Claude Code CLI (Max Plan)"
    base_url: ""
    auth_env: null  # Uses CLI authentication
    api_format: "claude_code"

  cerebras:
    name: "Cerebras (High-Speed)"
    base_url: "https://api.cerebras.ai/v1"
    auth_env: "CEREBRAS_API_KEY"
    api_format: "cerebras"

