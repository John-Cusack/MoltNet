# Task type mappings for routing decisions
task_routing:
  code:
    best: ["anthropic/claude-sonnet-4-5", "openai/gpt-4o", "mistral/codestral"]
    budget: ["deepseek/deepseek-chat", "ollama/qwen2.5-coder", "mistral/codestral"]
    free: ["ollama/qwen2.5-coder", "ollama/phi4-mini"]

  reasoning:
    best: ["anthropic/claude-opus-4", "openai/o1", "deepseek/deepseek-reasoner"]
    budget: ["deepseek/deepseek-reasoner", "openai/o3-mini", "ollama/deepseek-r1"]
    free: ["ollama/deepseek-r1", "ollama/phi4-mini"]

  general:
    best: ["anthropic/claude-sonnet-4-5", "openai/gpt-4o"]
    budget: ["deepseek/deepseek-chat", "openai/gpt-4o-mini"]
    free: ["ollama/llama3.2", "ollama/phi4-mini"]

  creative_writing:
    best: ["anthropic/claude-opus-4", "anthropic/claude-sonnet-4-5"]
    budget: ["anthropic/claude-haiku-3-5", "openai/gpt-4o-mini"]
    free: ["ollama/llama3.2"]

  math:
