# MoltNet Docker Compose - Full Stack
version: "3.8"

services:
  # Observatory - Telemetry Server
  observatory:
    build:
      context: ..
      dockerfile: docker/Dockerfile.observatory
    ports:
      - "9100:9100"
    volumes:
      - observatory-data:/data
    environment:
      - OBSERVATORY_HOST=0.0.0.0
      - OBSERVATORY_PORT=9100
      - OBSERVATORY_DATABASE_PATH=/data/observatory.db
      - OBSERVATORY_DEBUG=false
    healthcheck:
      test: ["CMD", "uv", "run", "python", "-c", "import httpx; httpx.get('http://localhost:9100/health', timeout=5)"]
      interval: 30s
      timeout: 10s
      retries: 3
      start_period: 10s
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 512M
          cpus: "0.5"

  # Bot Alpha - First bot in the colony
  bot-alpha:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    depends_on:
      observatory:
        condition: service_healthy
    environment:
      - BOT_NAME=nest-bot-alpha
      - BOT_GENERATION=1
      - BOT_CYCLES=10000
      - BOT_INTERVAL=30
      - OBSERVATORY_URL=http://observatory:9100
      - LLM_REGISTRY_PATH=/app/config/llm-registry.yaml
      # API Keys (set in .env file or environment)
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # Bot Beta - Second bot for testing colony dynamics
  bot-beta:
    build:
      context: ..
      dockerfile: docker/Dockerfile.bot
    depends_on:
      observatory:
        condition: service_healthy
    environment:
      - BOT_NAME=nest-bot-beta
      - BOT_GENERATION=1
      - BOT_CYCLES=10000
      - BOT_INTERVAL=45
      - OBSERVATORY_URL=http://observatory:9100
      - LLM_REGISTRY_PATH=/app/config/llm-registry.yaml
      - ANTHROPIC_API_KEY=${ANTHROPIC_API_KEY:-}
      - OPENAI_API_KEY=${OPENAI_API_KEY:-}
      - DEEPSEEK_API_KEY=${DEEPSEEK_API_KEY:-}
      - MISTRAL_API_KEY=${MISTRAL_API_KEY:-}
      - CEREBRAS_API_KEY=${CEREBRAS_API_KEY:-}
    restart: unless-stopped
    deploy:
      resources:
        limits:
          memory: 256M
          cpus: "0.25"

  # Ollama - Local LLM server (optional, for local models)
  ollama:
    image: ollama/ollama:latest
    ports:
      - "11434:11434"
    volumes:
      - ollama-data:/root/.ollama
    deploy:
      resources:
        limits:
          memory: 8G
          cpus: "4"
    profiles:
      - local-llm  # Only start with: docker compose --profile local-llm up

volumes:
  observatory-data:
    driver: local
  ollama-data:
    driver: local

networks:
  default:
    name: moltnet
